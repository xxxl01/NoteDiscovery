services:
  notediscovery:
    image: ghcr.io/gamosoft/notediscovery:latest
    container_name: notediscovery
    ports:
      - "8000:8000"
    volumes:
      # Required: Your notes
      - ./data:/app/data
      # Optional: Uncomment to customize (file/folder must exist with content!)
      # - ./config.yaml:/app/config.yaml
      # - ./themes:/app/themes
      # - ./plugins:/app/plugins
      # - ./locales:/app/locales
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4.1-mini}
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT:-You are a helpful note-taking assistant. Be concise and practical.}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s

